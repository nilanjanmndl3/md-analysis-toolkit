[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-analysis-toolkit"
version = "0.1.0"
description = "A lightweight toolkit for molecular dynamics trajectory analysis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
